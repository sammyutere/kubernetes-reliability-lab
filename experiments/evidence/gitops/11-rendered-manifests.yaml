---
apiVersion: v1
kind: Service
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: multi-service-app:/Service:reliability-lab/api
  labels:
    app.kubernetes.io/instance: multi-service-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: multi-service-reliability-lab
    monitoring: enabled
  name: api
  namespace: reliability-lab
spec:
  ports:
