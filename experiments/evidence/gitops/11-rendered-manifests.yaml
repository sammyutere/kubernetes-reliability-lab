---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/tracking-id: multi-service-app:apps/Deployment:reliability-lab/api
  labels:
    app.kubernetes.io/instance: multi-service-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: multi-service-reliability-lab
  name: api
  namespace: reliability-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: multi-service-app
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: multi-service-reliability-lab
    spec:
      containers:
      - env:
        - name: DEPENDENCY_URL
          value: http://dependency:80
        - name: REQUEST_TIMEOUT_SECONDS
          value: "2"
        image: 393864004024.dkr.ecr.us-east-1.amazonaws.com/api:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi

