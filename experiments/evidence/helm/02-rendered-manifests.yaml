      targetPort: http
---
# Source: reliability-app/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-app
  labels:
    app.kubernetes.io/name: reliability-app
    app.kubernetes.io/instance: reliability-app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: kubernetes-reliability-lab
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: reliability-app-0.1.0
    app.kubernetes.io/component: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: reliability-app
      app.kubernetes.io/instance: reliability-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: reliability-app
        app.kubernetes.io/instance: reliability-app
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: reliability-app
          image: "reliability-app:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: reliability-app-config
            - secretRef:
                name: reliability-app-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
---
# Source: reliability-app/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reliability-app-hpa
  labels:
    app.kubernetes.io/name: reliability-app
    app.kubernetes.io/instance: reliability-app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: kubernetes-reliability-lab
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: reliability-app-0.1.0
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reliability-app
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
