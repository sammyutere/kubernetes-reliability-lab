# Source: reliability-app/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reliability-app-ingress-policy
  labels:
    app.kubernetes.io/name: reliability-app
    app.kubernetes.io/instance: reliability-app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: kubernetes-reliability-lab
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: reliability-app-0.1.0
    app.kubernetes.io/component: network-security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: reliability-app
      app.kubernetes.io/instance: reliability-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: "allowed"
      ports:
        - protocol: TCP
          port: 8000
---
