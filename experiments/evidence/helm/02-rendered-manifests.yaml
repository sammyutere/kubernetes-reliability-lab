# Source: reliability-app/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: reliability-app
  labels:
    app.kubernetes.io/name: reliability-app
    app.kubernetes.io/instance: reliability-app
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/part-of: kubernetes-reliability-lab
