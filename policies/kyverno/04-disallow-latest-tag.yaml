apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-image-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Image Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Container images using the mutable latest tag are prohibited in the
      reliability-lab namespace. Workloads must reference a versioned image
      tag or an immutable digest.
    pod-policies.kyverno.io/autogen-controllers: >-
      Deployment,StatefulSet,DaemonSet,Job,CronJob
spec:
  background: true

  rules:
    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - reliability-lab

      validate:
        failureAction: Enforce
        message: >-
          The mutable image tag 'latest' is prohibited. Use a versioned image
          tag or immutable digest instead.

        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "!*:latest"

          - list: request.object.spec.initContainers
            pattern:
              image: "!*:latest"

          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "!*:latest"
