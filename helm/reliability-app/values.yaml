replicaCount: 3

image:
  repository: reliability-app
  tag: local
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: http

container:
  port: 8000

config:
  APP_NAME: reliability-app
  APP_VERSION: "0.1.0"
  APP_ENV: kubernetes-local
  LOG_LEVEL: info

secret:
  enabled: true
  name: reliability-app-secret

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  path: /readyz
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

livenessProbe:
  path: /healthz
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 8
  targetCPUUtilizationPercentage: 50

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  allowedPodLabel:
    key: access
    value: allowed
