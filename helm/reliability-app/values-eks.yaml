replicaCount: 3

image:
  repository: 393864004024.dkr.ecr.us-east-1.amazonaws.com/reliability-app
  tag: "0.1.0"
  pullPolicy: IfNotPresent

config:
  APP_NAME: reliability-app
  APP_VERSION: "0.1.0"
  APP_ENV: eks-dev
  LOG_LEVEL: info

secret:
  enabled: false
  name: reliability-app-secret

service:
  type: ClusterIP
  port: 80
  targetPort: http

container:
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60

pdb:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: alb
  path: /
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:393864004024:certificate/9a371515-b02c-47a9-937d-e3eae2b4381b
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/tags: Project=kubernetes-reliability-lab,Environment=dev
