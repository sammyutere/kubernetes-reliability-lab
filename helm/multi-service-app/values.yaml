global:
  imageRegistry: ""
  imageTag: local
  imagePullPolicy: IfNotPresent

services:
  frontend:
    replicas: 3
    image: frontend
    port: 8000
    env:
      API_URL: http://api:80
      REQUEST_TIMEOUT_SECONDS: "2"

  api:
    replicas: 3
    image: api
    port: 8000
    env:
      DEPENDENCY_URL: http://dependency:80
      REQUEST_TIMEOUT_SECONDS: "2"

  dependency:
    replicas: 3
    image: dependency
    port: 8000
    env:
      FAILURE_MODE: none
      LATENCY_MS: "0"

ingress:
  enabled: false
  className: ""
  path: /
  annotations: {}

serviceMonitor:
  enabled: false
