apiVersion: v1
kind: Pod
metadata:
  name: kyverno-gitops-denial-test
  labels:
    app.kubernetes.io/name: kyverno-gitops-denial-test
    app.kubernetes.io/part-of: kubernetes-reliability-lab
spec:
  restartPolicy: Never
  containers:
    - name: nginx
      image: nginx:latest
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
