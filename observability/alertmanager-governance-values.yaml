alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m

    route:
      receiver: default-receiver
      group_by: ['alertname', 'service', 'severity', 'slo']
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 30m
      routes:
        - matchers:
            - severity="critical"
          receiver: critical-sre
        - matchers:
            - severity="warning"
          receiver: warning-platform

    receivers:
      - name: default-receiver
      - name: critical-sre
      - name: warning-platform
