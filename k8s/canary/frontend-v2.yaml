apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v2
  namespace: reliability-lab
  labels:
    app.kubernetes.io/name: frontend
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      version: v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        version: v2
    spec:
      containers:
        - name: frontend
          image: frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_URL
              value: http://api:80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-canary
  namespace: reliability-lab
spec:
  selector:
    app.kubernetes.io/name: frontend
    version: v2
  ports:
    - name: http
      port: 80
      targetPort: http
