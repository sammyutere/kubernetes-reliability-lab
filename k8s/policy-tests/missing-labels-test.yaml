apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-labels-test
  namespace: reliability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-labels-test
  template:
    metadata:
      labels:
        app: missing-labels-test
    spec:
      containers:
        - name: frontend
          image: 393864004024.dkr.ecr.us-east-1.amazonaws.com/frontend:0.1.0-supply-chain
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
